name: Build Multi-Arch Caddy

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Fixes manual trigger checking out main instead of the selected branch
          ref: ${{ github.ref }}
      - name: Generate s6 Framework and Files
        run: |
          bash ./setup.sh

      # The metadata action versions are v5 (v6 does not exist yet)
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/caddy
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            # FIX: Generates a lowercase Docker tag from the branch name during manual runs
            type=ref,event=branch 

      # The QEMU action versions are v3 (v4 does not exist yet)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # The Buildx action versions are v3 (v4 does not exist yet)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The Login action versions are v3 (v4 does not exist yet)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Build-Push action versions are v6 (v7 does not exist yet)
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=caddy-v2
          cache-to: type=gha,mode=max,scope=caddy-v2
